  - id: auth_protects_pending_cancel
    suite: offline
    category: auth
    type: http
    method: DELETE
    path: /pending/abc123def456
    auth: none
    expect_status: 401
    forbid_audit: [cancelled]

  # Driven through the ASGI app with bounded reads: if auth regressed, the
  # stream would stay open forever.
  - id: auth_protects_event_stream
    suite: offline
    category: auth
    type: sse
    scenario: requires_auth
    auth_kinds: [none, wrong, query_param, empty_bearer, no_scheme, truncated]

  - id: auth_api_responses_are_not_cacheable
    suite: offline
    category: auth
    type: http
    method: GET
    path: /pending
    auth: valid
    expect_status: 200
    expect_json_keys: [pending, server_time]
    expect_headers: {Cache-Control: no-store, X-Content-Type-Options: nosniff}

  - id: auth_rejections_are_not_cacheable
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: wrong
    expect_status: 401
    expect_headers: {Cache-Control: no-store, X-Content-Type-Options: nosniff}

  - id: auth_options_request_never_reaches_handler
    suite: offline
    category: auth
    type: http
    method: OPTIONS
    path: /text-command
    auth: none
    expect_status: 405
    forbid_audit: [pending_confirmation, executed, failed]

  - id: auth_removed_git_route_stays_removed
    suite: offline
    category: auth
    type: http
    path: /git-command
    auth: valid
    json: {command: push to github}
    expect_status: 404

  - id: auth_removed_message_route_stays_removed
    suite: offline
    category: auth
    type: http
    path: /send-message
    auth: valid
    json: {command: send a text to John saying hi}
    expect_status: 404

  - id: pairing_token_stored_privately
    suite: offline
    category: auth
    type: token_storage
    min_length: 43

  # --- Permission gate: destructive commands are parked ----------------------

  - id: gate_parks_imessage
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: send a text to John saying hi}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: message_send}
    expect_json_keys: [pending_id]
    expect_audit: [pending_confirmation]
    forbid_audit: [executed, failed]

  - id: gate_parks_email
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: send an email to john@example.com saying the meeting moved}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: email_send}
    forbid_audit: [executed, failed]

  - id: gate_parks_git_push
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: push MyProject to github}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: git_push}
    forbid_audit: [executed, failed]

  - id: gate_parks_quit_everything
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: close everything}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: close_all_apps}
    forbid_audit: [executed, failed]

  - id: gate_rejects_empty_command
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: ""}
    expect_status: 200
    expect_json_contains: {error: no command}
    forbid_audit: [pending_confirmation, executed, failed]

  # The classifier does not recognise this phrasing as an email, so the command
  # runs as a general act-tier command. The policy gate must still refuse to
  # send. If the classifier ever learns this phrasing, swap in one it misses.
  - id: gate_blocks_send_when_classifier_misses_it
    suite: offline
    category: permission_gate
    type: tracing
    scenario: command
    via_http: true
    real_pipe: true
    command: mail john@example.com the quarterly report
    generation:
      script: |
        tell application "Mail"
            set m to make new outgoing message with properties {subject:"Quarterly report", content:"Attached.", visible:false}
            tell m to make new to recipient with properties {address:"john@example.com"}
            send m
        end tell
      input_tokens: 800
      output_tokens: 90
    expect: {category: applescript_general, decision: failed, ok: 0, repair_attempts: 0}
    expect_error_contains: requires confirmation
    expect_audit_decisions: [script_blocked]

  # --- Confirm flow ----------------------------------------------------------

  - id: confirm_nothing_runs_before_confirmation
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: no_execution_before_confirm

  - id: confirm_unknown_id_rejected
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: unknown_id_rejected

  - id: confirm_runs_server_stored_command_not_client_input
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: executes_server_stored_command

  - id: confirm_id_is_single_use
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: single_use

  - id: confirm_id_expires_after_ttl
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: expires
    age_seconds: 121

  - id: confirm_requires_auth
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: confirm_requires_auth

  - id: confirm_ids_are_independent
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: ids_are_independent
    second_command: send an email to test@example.com saying hello

  - id: confirm_marks_only_confirmed_commands
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: confirmation_marks_only_confirmed_commands
    unconfirmed_command: open notes

  - id: confirm_parked_response_describes_the_command
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: parked_response_describes_the_command
    command: send a text to 5551234567 saying running late
    client_id: phone-tab_1
    expect_details:
      - {label: To, value: "+15551234567"}
      - {label: Message, value: running late}

  # Details are built from the handlers' pure parsers only: a named recipient is
  # shown as typed, and nothing reads Contacts or runs a process before Confirm.
  - id: confirm_details_never_look_anything_up
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: details_never_look_anything_up
    cases:
      - command: send a text to John saying hi
        expect_details:
          - {label: To, value: John (looked up in Contacts when you confirm)}
          - {label: Message, value: hi}
      # A recipient the parser cannot read still gets a To row, so the card
      # never hides who a send is aimed at.
      - command: text 555-0100 saying on my way
        expect_details:
          - {label: To, value: "Not recognised — nothing will be sent"}
          - {label: Message, value: on my way}
      - command: send an email to john@example.com saying the meeting moved to 3pm
        expect_details:
          - {label: To, value: john@example.com}
          - {label: Message, value: the meeting moved to 3pm}
      - command: push Imperium to github
        expect_details:
          - {label: Runs, value: git push}
          - {label: Repository, value: "A folder matching “Imperium” on your Desktop, in Documents, or in Projects; if there is none, the most recently changed Git repository on your Desktop"}
      - command: close everything
        expect_details:
          - {label: Quits, value: Every open app except Finder}

  - id: confirm_client_id_is_validated
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: client_id_validation
    act_command: open notes
    cases:
      - {client_id: phone-1_A, expect: phone-1_A}
      - {client_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, expect: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      - {client_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, expect: null}
      - {client_id: "", expect: null}
      - {client_id: has space, expect: null}
      - {client_id: tab.1, expect: null}
      - {client_id: "<script>", expect: null}
      - {client_id: "tab\n", expect: null}
      - {client_id: 12345, expect: null}
      - {client_id: [phone], expect: null}

  - id: confirm_cancel_revokes_the_pending_id
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: cancel_revokes

  - id: confirm_cancel_requires_auth
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: cancel_requires_auth

  - id: confirm_unknown_or_expired_ids_change_nothing
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: unknown_and_expired_ids_have_no_side_effects
    second_command: send an email to test@example.com saying hello there
    age_seconds: 121

  - id: confirm_pending_list_never_shows_expired
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: pending_list_excludes_expired
    more_commands: [send an email to test@example.com saying hello there, close everything]
    age_seconds: 121

  - id: confirm_keeps_command_and_client_ids
    suite: offline
    category: confirm_flow
    type: confirm_flow
    scenario: confirm_keeps_command_ids

