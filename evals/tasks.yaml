    type: retry
    scenario: runtime_error_repaired
    expect: {returncode: 0, repair_attempts: 1, repair_succeeded: true, runtime_error_contains: "Can't get window"}

  - id: repair_fixes_validation_error
    suite: offline
    category: repair_loop
    type: retry
    scenario: validation_error_repaired
    expect: {returncode: 0, repair_attempts: 1, repair_succeeded: true, static_error_contains: theURL}

  - id: repair_is_bounded
    suite: offline
    category: repair_loop
    type: retry
    scenario: bounded_at_max
    expect: {returncode: 1, repair_attempts: 2, repair_succeeded: false, stderr_contains: after 2 repair attempts}

  - id: repair_never_retries_a_policy_block
    suite: offline
    category: repair_loop
    type: retry
    scenario: policy_block_is_terminal
    expect: {returncode: 1, repair_attempts: 0, repair_succeeded: false, stderr_startswith: "Blocked by policy:"}

  - id: repair_failure_is_graceful
