    category: repair_loop
    type: retry
    scenario: repair_cannot_bypass_policy_gate
    expect: {returncode: 1, repair_attempts: 1, repair_succeeded: false, stderr_startswith: "Blocked by policy:"}

  - id: repair_disallowed_script_is_blocked_before_validation
