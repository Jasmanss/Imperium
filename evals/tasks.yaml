  # --- Built-in handler scripts ----------------------------------------------
  #
  # Handlers run fixed AppleScript templates outside the policy gate, so a value
  # from the command must never escape its string literal. Each crafted value
  # closes the literal with \" (or a bare ") and appends a shell call.

  - id: handler_spotify_query_stays_quoted
    suite: offline
    category: handler_escaping
    type: handler_injection
    handler: spotify_play
    benign: lofi beats
    crafted: 'x\" & (do shell script ((ASCII character 105) & (ASCII character 100))) --'
    payload_marker: do shell script

