  - id: auth_removed_git_route_stays_removed
    suite: offline
    category: auth
    type: http
    path: /git-command
    auth: valid
    json: {command: push to github}
    expect_status: 404

  - id: auth_removed_message_route_stays_removed
    suite: offline
    category: auth
    type: http
    path: /send-message
    auth: valid
    json: {command: send a text to John saying hi}
    expect_status: 404

  - id: pairing_token_stored_privately
    suite: offline
    category: auth
    type: token_storage
    min_length: 43

  # --- Permission gate: destructive commands are parked ----------------------

  - id: gate_parks_imessage
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: send a text to John saying hi}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: message_send}
    expect_json_keys: [pending_id]
    expect_audit: [pending_confirmation]
    forbid_audit: [executed, failed]

  - id: gate_parks_email
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: send an email to john@example.com saying the meeting moved}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: email_send}
    forbid_audit: [executed, failed]

  - id: gate_parks_git_push
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: push MyProject to github}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: git_push}
    forbid_audit: [executed, failed]

  - id: gate_parks_quit_everything
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: close everything}
    expect_status: 200
    expect_json: {requires_confirmation: true, category: close_all_apps}
    forbid_audit: [executed, failed]

  - id: gate_rejects_empty_command
    suite: offline
    category: permission_gate
    type: http
    path: /text-command
    json: {command: ""}
    expect_status: 200
    expect_json_contains: {error: no command}
    forbid_audit: [pending_confirmation, executed, failed]

  # The classifier does not recognise this phrasing as an email, so the command
  # runs as a general act-tier command. The policy gate must still refuse to
  # send. If the classifier ever learns this phrasing, swap in one it misses.
  - id: gate_blocks_send_when_classifier_misses_it
    suite: offline
    category: permission_gate
    type: tracing
    scenario: command
    via_http: true
    real_pipe: true
    command: mail john@example.com the quarterly report
    generation:
      script: |
        tell application "Mail"
            set m to make new outgoing message with properties {subject:"Quarterly report", content:"Attached.", visible:false}
            tell m to make new to recipient with properties {address:"john@example.com"}
            send m
        end tell
      input_tokens: 800
      output_tokens: 90
    expect: {category: applescript_general, decision: failed, ok: 0, repair_attempts: 0}
    expect_error_contains: requires confirmation
    expect_audit_decisions: [script_blocked]

  # --- Confirm flow ----------------------------------------------------------

  - id: confirm_nothing_runs_before_confirmation
