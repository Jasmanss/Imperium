# Imperium eval tasks — run with `python3 evals/runner.py` (see runner.py for task types).
#
# suite: offline  deterministic, no API key, never runs AppleScript, keystrokes, or model calls
# suite: live     real commands on a real Mac, verified with osascript (--live)
#
# Destructive commands (email, iMessage, git push, quit everything) appear ONLY as
# gate checks that assert the command is parked for confirmation. No task ever
# confirms an outward-facing action.

tasks:

  # --- Auth: deny by default -------------------------------------------------

  - id: auth_rejects_missing_token
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: none
    expect_status: 401
    expect_json_contains: {error: not paired}

  - id: auth_rejects_wrong_token
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: wrong
    expect_status: 401

  - id: auth_rejects_truncated_token
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: truncated
    expect_status: 401

  - id: auth_rejects_extended_token
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: extended
    expect_status: 401

  - id: auth_rejects_token_without_bearer_scheme
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: no_scheme
    expect_status: 401

  - id: auth_rejects_basic_scheme
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: basic_scheme
    expect_status: 401

  - id: auth_rejects_empty_bearer
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: empty_bearer
    expect_status: 401

  - id: auth_rejects_token_in_query_string
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: query_param
    expect_status: 401

  - id: auth_accepts_valid_token
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: valid
    expect_status: 200
    expect_json_keys: [entries]

  - id: auth_accepts_lowercase_bearer_scheme
    suite: offline
    category: auth
    type: http
    method: GET
    path: /audit
    auth: lowercase_scheme
    expect_status: 200

  - id: auth_denies_unknown_route_before_routing
    suite: offline
    category: auth
    type: http
    method: GET
    path: /does-not-exist
    auth: none
    expect_status: 401

  - id: auth_unknown_route_with_token_is_404
    suite: offline
    category: auth
    type: http
    method: GET
    path: /does-not-exist
    auth: valid
    expect_status: 404

  - id: auth_health_check_is_public
    suite: offline
    category: auth
    type: http
    method: GET
    path: /
    auth: none
    expect_status: 200
    expect_json_contains: {status: ready}

  - id: auth_frontend_is_public
    suite: offline
    category: auth
    type: http
    method: GET
    path: /app/
    auth: none
    expect_status: 200

  - id: auth_public_prefix_is_exact
    suite: offline
    category: auth
    type: http
    method: GET
    path: /application
    auth: none
    expect_status: 401

  - id: auth_protects_text_command
    suite: offline
    category: auth
    type: http
    path: /text-command
    auth: none
