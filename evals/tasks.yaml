    expect_status: 401
    forbid_audit: [pending_confirmation, executed, failed]

  - id: auth_protects_confirm
    suite: offline
    category: auth
    type: http
    path: /confirm/abc123
    auth: none
    expect_status: 401

  - id: auth_protects_stats
    suite: offline
